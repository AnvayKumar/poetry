name: Post Poetry to Instagram

on:
  schedule:
    # Runs every 3 days at 9:00 AM UTC (2:00 PM IST)
    - cron: '0 9 */3 * *'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  post-poem:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get install -y ffmpeg

      - name: Post poem to Instagram
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: python post_poem.py
