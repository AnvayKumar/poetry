name: Post Poetry to Instagram

on:
  schedule:
    - cron: '0 9 */3 * *'
  workflow_dispatch:

jobs:
  post-poem:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and fonts
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-cjk
          fc-cache -f -v
          echo "=== Available Devanagari fonts ==="
          fc-list :lang=hi

      - name: Post poem to Instagram
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: python post_poem.py

      - name: Save posting history
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add posted_history.json promo_history.json || true
          git diff --staged --quiet || git commit -m "Update posting history"
          git push
